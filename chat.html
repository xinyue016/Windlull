<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#a9d8f2" />
  <title>情绪日记 · 风歇小筑</title>
  <script>
    try {
      if (localStorage.getItem('emotion-atlas-theme') === 'night') {
        document.documentElement.classList.add('night-mode');
      }
    } catch (_) { /* storage may be disabled */ }
  </script>
  <link rel="stylesheet" href="assets/css/chat.css?v=20261119-12" />
  <link rel="stylesheet" href="assets/css/app-sidebar.css?v=20261119-12" />
  <script src="assets/js/background-music.js?v=20261120-13" defer></script>
  <script src="assets/js/app-sidebar.js?v=20261120-20" defer></script>
  <script src="assets/js/chat.js?v=20261118-8" defer></script>
</head>
<body data-page="diary">
  <div class="chat-background" aria-hidden="true"></div>
  <div class="chat-frame" aria-hidden="true"></div>

  <main class="diary-app">
    <section class="diary-main">
      <header class="diary-header">
        <div>
          <h1>情绪日记</h1>
          <p class="diary-intro">让情绪有一个可以被看见的位置。无需写得完整，留下一笔就好。</p>
        </div>
        <div class="diary-stats" aria-label="记录数量">
          <span>当前 <b id="activeMoodCount">0</b></span>
          <span>历史 <b id="historyMoodCount">0</b></span>
        </div>
      </header>

      <div class="diary-local-note">
        <span aria-hidden="true"></span>
        提示：所有内容仅保存在当前浏览器本机，下次从同一设备、同一浏览器进入时仍会保留，不会上传服务器。
      </div>

      <div class="mood-board" id="moodBoard">
        <div class="mood-empty" id="moodEmpty">
          <strong>还没有留下记录</strong>
          <span>点击下方“添加记录”，写下此刻的时间、情绪和事件。</span>
        </div>
        <div class="mood-records" id="moodRecords" aria-live="polite">
          <div class="mood-records-canvas" id="moodRecordsCanvas"></div>
        </div>

        <div class="mood-actions" aria-label="情绪记录操作">
          <button class="mood-action mood-action--add" id="addMoodButton" type="button">
            <span aria-hidden="true">＋</span>
            <small>添加记录</small>
          </button>
          <button class="mood-action mood-action--history" id="historyMoodButton" type="button">
            <span aria-hidden="true">🕒</span>
            <small>历史记录</small>
          </button>
        </div>
      </div>
    </section>
  </main>

  <div class="diary-modal" id="addMoodModal" aria-hidden="true">
    <div class="diary-modal-backdrop" data-close-add-mood></div>
    <section class="diary-modal-panel" role="dialog" aria-modal="true" aria-labelledby="addMoodTitle" tabindex="-1">
      <header class="diary-modal-header">
        <div>
          <p>新的一笔</p>
          <h2 id="addMoodTitle">记录此刻的情绪</h2>
        </div>
        <button class="diary-modal-close" id="cancelAddMoodTop" type="button" aria-label="关闭添加记录">×</button>
      </header>
      <form class="mood-form" id="addMoodForm">
        <label>
          <span>时间</span>
          <input id="moodTimeInput" type="text" maxlength="30" required placeholder="例如：2026.11.18 20:30" />
        </label>
        <label>
          <span>情绪</span>
          <select id="moodEmotionInput">
            <option value="joy">喜悦 😊</option>
            <option value="trust">信任 🤝</option>
            <option value="fear">恐惧 😨</option>
            <option value="surprise">惊讶 😲</option>
            <option value="sadness">悲伤 😢</option>
            <option value="disgust">厌恶 🤢</option>
            <option value="anger">愤怒 😠</option>
            <option value="anticipation">期待 🤩</option>
          </select>
        </label>
        <label>
          <span>事件</span>
          <textarea id="moodEventInput" maxlength="500" rows="4" required placeholder="写下发生了什么，以及你当时的感受。"></textarea>
        </label>
        <p class="mood-form-note">同屏最多保留 50 条记录，更早的记录会进入历史记录。</p>
        <p class="mood-form-error" id="moodFormError" role="alert"></p>
        <div class="diary-modal-actions">
          <button class="diary-button diary-button--quiet" id="cancelAddMood" type="button">取消</button>
          <button class="diary-button diary-button--primary" type="submit">确定添加</button>
        </div>
      </form>
    </section>
  </div>

  <div class="diary-modal" id="detailMoodModal" aria-hidden="true">
    <div class="diary-modal-backdrop" data-close-mood-detail></div>
    <section class="diary-modal-panel diary-detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailMoodTitle" tabindex="-1">
      <header class="diary-modal-header">
        <div>
          <p>情绪记录</p>
          <h2 id="detailMoodTitle">这一笔心情</h2>
        </div>
        <button class="diary-modal-close" id="closeMoodDetailTop" type="button" aria-label="关闭情绪记录">×</button>
      </header>
      <dl class="mood-detail-list">
        <div><dt>时间</dt><dd id="detailMoodTime"></dd></div>
        <div><dt>情绪</dt><dd id="detailMoodEmotion"></dd></div>
        <div><dt>事件</dt><dd id="detailMoodEvent"></dd></div>
      </dl>
      <div class="diary-modal-actions">
        <button class="diary-button diary-button--danger" id="deleteMoodButton" type="button">删除本条</button>
        <button class="diary-button diary-button--quiet" id="closeMoodDetail" type="button">关闭</button>
      </div>
    </section>
  </div>

  <div class="diary-modal" id="historyMoodModal" aria-hidden="true">
    <div class="diary-modal-backdrop" data-close-mood-history></div>
    <section class="diary-modal-panel diary-history-panel" role="dialog" aria-modal="true" aria-labelledby="historyMoodTitle" tabindex="-1">
      <header class="diary-modal-header">
        <div>
          <p>历史记录</p>
          <h2 id="historyMoodTitle">更早的心情</h2>
        </div>
        <button class="diary-modal-close" id="closeMoodHistoryTop" type="button" aria-label="关闭历史记录">×</button>
      </header>
      <div class="mood-history-list" id="historyMoodList"></div>
      <div class="diary-modal-actions">
        <button class="diary-button diary-button--quiet" id="closeMoodHistory" type="button">关闭</button>
      </div>
    </section>
  </div>

  <div class="agent-star-widget diary-star-widget" id="diaryStarWidget" role="button" tabindex="0" aria-label="可拖动的星星挂件" title="拖一拖我">
    <span class="star-string" aria-hidden="true"></span>
    <div class="star-hanger" id="diaryStarHanger">
      <div class="star-model" id="diaryStarModel" aria-hidden="true">
        <span class="star-face star-face--deep star-face--deep-5"></span>
        <span class="star-face star-face--deep star-face--deep-4"></span>
        <span class="star-face star-face--deep star-face--deep-3"></span>
        <span class="star-face star-face--deep star-face--deep-2"></span>
        <span class="star-face star-face--deep star-face--deep-1"></span>
        <span class="star-face star-face--front">
          <span class="star-shine"></span>
        </span>
      </div>
    </div>
    <div class="star-speech" id="diaryStarSpeech" aria-live="polite"></div>
  </div>
</body>
</html>
